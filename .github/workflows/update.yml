# Keeps a club's copy of Kabine up to date. The "Deploy to Cloudflare" button creates a copy of the
# repository (not a fork) in the club's GitHub account. Once a week this workflow looks for a new
# Kabine release and opens a pull request with it. Merging the pull request deploys the new version
# (Workers Builds), including database migrations.
#
# The club's own settings in wrangler.jsonc (resource IDs, domain) are kept.
name: Kabine updates

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: https://github.com/witscher/kabine.git

jobs:
  update:
    # Only in copies, not in the Kabine repository itself
    if: github.repository != 'witscher/kabine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find the latest release
        id: release
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream 'refs/tags/v*:refs/tags/upstream/v*' --no-tags
          latest=$(git tag --list 'upstream/v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then echo "No release yet"; exit 0; fi
          version=${latest#upstream/}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "kabine-update-$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ -f .kabine-version ] && [ "$(cat .kabine-version)" = "$version" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare the update
        if: steps.release.outputs.version && !steps.release.outputs.exists
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "kabine-update"
          git config user.email "kabine-update@users.noreply.github.com"
          git checkout -b "kabine-update-$VERSION"
          # The copy has its own history. One commit on top of it with the release's files: files the release
          # removed are removed, the club's wrangler.jsonc stays. No merge, so none of Kabine's history is pushed.
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git checkout "upstream/$VERSION" -- .
          git checkout HEAD -- wrangler.jsonc
          git show "upstream/$VERSION:wrangler.jsonc" > /tmp/wrangler.release.jsonc
          # GitHub does not let this workflow change workflow files (GITHUB_TOKEN has no "workflows" permission),
          # so the copy keeps its own; the pull request lists the ones the release changes
          git diff --name-only HEAD "upstream/$VERSION" -- .github/workflows > /tmp/changed-workflows.txt
          rm -rf .github/workflows
          if git cat-file -e HEAD:.github/workflows 2>/dev/null; then git checkout HEAD -- .github/workflows; fi
          echo "$VERSION" > .kabine-version
          git add -A
          # New migrations change the database: the deploy then puts the app into maintenance for about a minute
          git diff --cached --name-only --diff-filter=A -- migrations/ | grep '\.sql$' > /tmp/new-migrations.txt || true
          git commit --quiet -m "Kabine $VERSION" || true
          git push --quiet origin "kabine-update-$VERSION"
      - name: Open the pull request
        if: steps.release.outputs.version && !steps.release.outputs.exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          notes=$(git show "upstream/$VERSION:CHANGELOG.md" 2>/dev/null | awk "/^## $VERSION/{f=1;next}/^## /{f=0}f" | head -n 80)
          if ! diff -q <(sed 's/"database_id": *"[^"]*"//;s/"id": *"[^"]*"//' /tmp/wrangler.release.jsonc) <(sed 's/"database_id": *"[^"]*"//;s/"id": *"[^"]*"//' wrangler.jsonc) >/dev/null; then
            wrangler_note=$'\n\n**Check wrangler.jsonc:** the release changes the Cloudflare configuration (for example a new binding). Compare your wrangler.jsonc with the one of the release and add new entries before merging.'
          fi
          if [ -s /tmp/new-migrations.txt ]; then
            migration_note=$'\n\n**Database changes:** this release changes the database ('"$(sed 's/.*\///' /tmp/new-migrations.txt | paste -sd, - | sed 's/,/, /g')"$'). While the deploy runs, the app shows "being updated" for about a minute, so merge at a quiet time. The deploy log and Administration → Updates show a restore point.'
          else
            migration_note=$'\n\nNo database changes: the app keeps running during the deploy.'
          fi
          if [ -s /tmp/changed-workflows.txt ]; then
            workflow_note=$'\n\n**Update the workflows by hand:** GitHub does not let this automatic update change files in `.github/workflows`. Replace these files in your copy with the ones of the release (open the link, copy the content, edit the file in your copy on GitHub and paste):'
            while read -r f; do workflow_note+=$'\n'"- [$f](https://github.com/witscher/kabine/blob/$VERSION/$f)"; done < /tmp/changed-workflows.txt
          fi
          {
            echo "Kabine $VERSION is available. Merging this pull request deploys it.${migration_note}${wrangler_note:-}${workflow_note:-}"
            echo
            echo "$notes"
          } > /tmp/pr-body.md
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "kabine-update-$VERSION" \
            --title "Update Kabine to $VERSION" --body-file /tmp/pr-body.md
