name: Deploy demo

# Keeps handball.kabine.dev on the latest Kabine: every push to main (after the checks pass) deploys
# the demo environment and starts the demo over with fresh data. Runs only in the Kabine repository,
# not in a club's copy. Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DEMO_RESET_TOKEN.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'witscher/kabine' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build, migrate and deploy the demo
        run: npm run deploy:demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Start the demo over
        run: node scripts/demo-reset.mjs
        env:
          DEMO_RESET_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
