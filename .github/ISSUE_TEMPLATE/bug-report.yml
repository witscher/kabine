name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include names or other personal data of your club's members. Security problems: see SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a coach
        2. Open ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kabine version or commit
      description: The release tag of your club's copy on GitHub (see its latest update pull request), or a commit
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari, installed on the home screen
  - type: dropdown
    id: role
    attributes:
      label: Role of the person affected
      multiple: true
      options:
        - Player
        - Parent
        - Coach
        - Team staff
        - Admin
